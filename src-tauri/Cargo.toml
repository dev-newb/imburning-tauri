[package]
name = "imburning"
version = "0.1.0"
description = "I'm Burning! — AI usage widget"
authors = ["Rich McQuail"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
chrono = "0.4"
regex = "1"
dirs = "5"
anyhow = "1"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSException", "NSObjCRuntime", "NSString", "NSDictionary"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Wry catches Objective-C exceptions when WebKit cancels a resource request.
# Aborting prevents that catch from running and turns cancellation into SIGABRT.
panic = "unwind"
strip = true
