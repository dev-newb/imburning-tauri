<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data:;
        connect-src ipc: http://ipc.localhost;
    ">
    <title>I'm Burning! — Graph</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: var(--g-bg, #16161e);
            color: var(--g-text, #cfcfe0);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .gtoolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-bottom: 1px solid var(--g-border, #2a2a38);
            flex: 0 0 auto;
        }
        .gtitle { font-size: 12px; font-weight: 700; color: var(--g-title, #e6e6f0); letter-spacing: .2px; }
        .gspacer { flex: 1; }
        .pin-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 7px;
            border: 1px solid rgba(140, 140, 170, .35);
            background: rgba(140, 140, 170, .12);
            color: #b9b9cc;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }
        .pin-btn.on { color: #35e0ff; border-color: rgba(53, 224, 255, .5); background: rgba(53, 224, 255, .12); }
        body.light .pin-btn { border-color: rgba(60, 60, 90, .3); background: rgba(60, 60, 90, .07); color: #4a4a60; }
        body.light .pin-btn.on { color: #0a8bb0; border-color: rgba(10, 139, 176, .5); background: rgba(53, 224, 255, .12); }
        .gwrap { flex: 1; position: relative; padding: 8px 10px 10px; min-height: 0; }
        canvas { position: absolute; inset: 8px 10px 10px; }
        /* Forecast-projection toggle — same sprite and corner as the inline graph */
        .psychic-btn {
            position: absolute;
            bottom: 8px;
            right: 12px;
            z-index: 5;
            width: 26px;
            height: 26px;
            padding: 1px;
            border: none;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            opacity: 0.9;
            transition: opacity .15s, background .15s, filter .15s;
        }
        .psychic-btn img { width: 24px; height: 24px; display: block; image-rendering: pixelated; }
        .psychic-btn:hover { opacity: 1; background: rgba(139, 92, 246, 0.15); }
        .psychic-btn.on { filter: drop-shadow(0 0 5px rgba(53, 224, 255, 0.55)); }
        .gempty {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #7a7a90; font-size: 12px; text-align: center; padding: 20px;
        }
        /* The clown-jail (pizazz off) reaches the detached graph too */
        body.no-pizazz *, body.no-pizazz *::before, body.no-pizazz *::after {
            animation: none !important;
            transition: none !important;
        }
    </style>
</head>

<body>
    <div class="gtoolbar">
        <span class="gtitle">I'm Burning! — Usage Graph</span>
        <span class="gspacer"></span>
        <button class="pin-btn" id="pinBtn" title="Keep this graph window above other windows">📌 <span id="pinLabel">On top</span></button>
    </div>
    <div class="gwrap">
        <canvas id="usageChart" role="img" aria-label="Usage history chart"></canvas>
        <div class="gempty" id="gEmpty" style="display:none;">No usage history yet — the graph fills in as data is collected.</div>
        <button class="psychic-btn" id="psychicBtn" title="Forecast projections">
            <img id="psychicImg" src="../../assets/psychic-idle.png" alt="Forecast projections toggle">
        </button>
    </div>
    <script src="chart.umd.js"></script>
    <script src="tauri-shim.js"></script>
    <script src="chart-utils.js"></script>
    <script src="graph.js"></script>
</body>

</html>
